name: stgnn_exp2_hybrid_short_windows
model_type: stgnn
sampling:
  last_validation_cutoff: "2026-10-07 16:00:00"
  train_start: "2026-03-04 16:00:00"
features:
  windows_days: [1, 3, 7, 14, 28, 56, 91]
data:
  dataset_dir: ${BIG_DATA_NYCU_STORAGE}/data/hw2/assignment2
stgnn:
  num_steps: 12
  step_days: 7
  hidden_dims: 64
  num_heads: 4
  num_layers: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 512
  epochs: 30
  patience: 5
  use_engineered_user_features: true
  device: cuda
  seed: 42
