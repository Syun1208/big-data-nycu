name: rdl_gnn_exp1
model_type: rdl_gnn
data:
  dataset_dir: ${BIG_DATA_NYCU_STORAGE}/data/hw2/assignment2
gnn:
  lookback_days: 91
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
