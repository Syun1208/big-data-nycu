name: tabpfn_exp1
model_type: tabpfn
data:
  dataset_dir: ${BIG_DATA_NYCU_STORAGE}/data/hw2/assignment2
sampling:
  anchor_cutoff: "2026-11-11 16:00:00"
  train_start: "2026-03-04 16:00:00"
  horizon_days: 7
  feature_gap_hours: 4
  population_lag_days: 14
  population_window_days: 90
  population_min_records: 5
  calibration_weeks: 1
  holdout_weeks: 1
features:
  windows_days: [1, 3, 7, 14, 28, 56, 91]
  half_lives_days: [3.0, 14.0]
  active_weeks: 8
  recency_cap_days: 365.0
  repo_lookback_days: 28
  repo_heat_days: 7
  collaboration_days: 28
  received_days: 14
  open_item_days: 56
  behavior_weeks: 13
tabpfn:
  model_version: v2
  n_estimators: 4
  max_context_rows: 10000
  positive_fraction: 0.25
  device: cuda
  seed: 42
